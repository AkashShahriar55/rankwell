name: Feature request
description: Something Rankwell should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: What you would say to Claude, and what should happen.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
