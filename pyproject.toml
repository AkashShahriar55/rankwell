[project]
name = "rankwell"
version = "0.1.1"
description = "App Store Optimization and release assistant for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Akash Shahriar" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "keyring>=25",
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
rankwell = "rankwell.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rankwell"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rankwell"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rankwell.mcp.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["keyring.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
