<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;background:transparent}
.tile{position:absolute;inset:0;border-radius:224px;background:
 radial-gradient(700px 600px at 70% 20%, rgba(61,220,151,.22), transparent 60%),
 linear-gradient(160deg,#141c26,#0a0e13);border:6px solid #233042}
.mark{position:absolute;left:232px;bottom:262px;display:flex;align-items:flex-end;gap:52px}
.mark i{display:block;width:96px;border-radius:26px;background:#3ddc97}
.mark i:nth-child(1){height:170px;opacity:.45}.mark i:nth-child(2){height:290px;opacity:.65}
.mark i:nth-child(3){height:400px;opacity:.85}.mark i:nth-child(4){height:500px}
</style></head><body><div class="tile"></div><div class="mark"><i></i><i></i><i></i><i></i></div></body></html>
